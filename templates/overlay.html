<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contest Overlay</title>
    <style>
        html, body {
            width: 1300px;
            height: 520px;
            margin: 0;
            padding: 0;
            background: transparent !important;
        }
        body {
            overflow: hidden;
            background: transparent !important;
        }
        .overlay-box {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 5px;
        }
        .overlay-content {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            width: 1280px;
        }
        .contest-column {
            display: flex;
            flex: 1 1 auto;
            min-width: 0;
            width: 100%;

        }

            width: auto;
            max-width: 800px;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
            background: rgba(0,0,0,0.9);
            border-radius: 10px;
            padding: 10px 20px;
            margin-left: 24px;
            text-align: center;
            border: 2px solid #fff;
        }
        .clock {
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 28px;
            color: #fff;
            background: rgba(0,0,0,0.9);
            border-radius: 10px;
            padding: 6px 14px;
            margin-right: 6px;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.8);
        }
        .status-message {
            max-width: 1180px;
            font-size: 24px;
        }

        .submissions-box {
            width: 145px;
        }
        .submissions {
            width: 145px;
            max-height: 300px;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #fff;
        }
        .submission-row {
            display: grid;
            grid-template-columns: 28px 69px 48px;
            align-items: center;
            height: 32px;
            font-size: 17px;
            line-height: 20px;
        }
        .submission-row + .submission-row {
            margin-top: 2px;
        }
        .submission-cell {
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 32px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .submission-result {
            font-weight: 700;
        }
        .submission-problem {
            font-weight: 700;
            background-color: rgba(30, 144, 255, 0.8);
        }
        .submission-time {
            background-color: #aaa;
        }
        .submission-empty {
            overflow: hidden;
            font-size: 13px;
            line-height: 18px;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #fff;
            background: rgba(0,0,0,0.9);
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 8px;
            padding: 6px 8px;
        }
        .submission-result.accepted {
            background-color: rgba(32, 139, 32, 0.8);
        }
        .submission-result.failed {
            background-color: rgba(200, 50, 50, 0.8);
        }
        .submission-result.pending {
            color: #000;
            background-color: rgba(255,238,170,1.000);
        }
    </style>
</head>
<body>
    <script>
        function calcTime() {
            {% if contest and contest.start_time and contest.end_time %}
                const startTime = new Date("{{ contest.start_time }}");
                const endTime = new Date("{{ contest.end_time }}");
                const now = new Date();

                const remainingSeconds = Math.ceil((endTime - now) / 1000);

                if (remainingSeconds < 0) {
                    return "00:00:00";
                } else {
                    const hours = Math.floor(remainingSeconds / 3600);
                    const minutes = Math.floor((remainingSeconds % 3600) / 60);
                    const seconds = remainingSeconds % 60;
                    return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }
            {% else %}
                return "00:00:00";
            {% endif %}
        }
        function updateClock() {
            const clock = document.querySelector('.clock');
            if (clock) {
                clock.textContent = calcTime();
            }
        }
        const clockInterval = setInterval(updateClock, 1000);
    </script>
    <script>
        const contestName = {% if contest and contest.name %}{{ contest.name|tojson }}{% else %}""{% endif %};

        function checkUpdate() {
            const clock = document.querySelector('.clock');
            if (clock && clock.textContent === '00:00:00') {
                location.reload();
            }
            fetch('/overlay-update?contest={{ contest_id }}&player={{ player }}')
                .then(resp => resp.text())
                .then(html => {
                    document.getElementById('overlay-update').innerHTML = html;
                    const updateRoot = document.createElement('div');
                    updateRoot.innerHTML = html;
                    const nextName = updateRoot.querySelector('.contest-name')?.textContent.trim() || '';
                    if (contestName && nextName !== contestName) {
                        location.reload();
                    }
                });
        }
        setInterval(checkUpdate, 10000);
    </script>
    <div id="overlay-update">
        {% include 'overlay_update.html' %}
    </div>
    <script>
        updateClock();
    </script>
</body>
</html>
